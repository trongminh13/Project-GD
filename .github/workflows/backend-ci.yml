name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Run Backend Test Suite
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: ashadeep_school_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password123
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Make Maven Wrapper Executable
        run: chmod +x mvnw
        working-directory: backend/school-backend

      - name: Run Backend Tests
        run: ./mvnw clean test
        working-directory: backend/school-backend
        env:
          DB_URL: jdbc:postgresql://localhost:5432/ashadeep_school_db
          DB_USERNAME: postgres
          DB_PASSWORD: password123
