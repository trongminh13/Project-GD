<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Cổng Thông Tin Giáo Dục Đại Việt - Hệ thống quản lý trường học và học liệu số thông minh.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Giáo Dục Đại Việt">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Cổng Thông Tin Giáo Dục Đại Việt</title>
  <!-- Google Fonts Preconnect & Optimized Fallback -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <style>
    body {
      margin: 0;
      padding: 0;
      background: #FFFFFF;
      font-family: "Plus Jakarta Sans", "Be Vietnam Pro", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    #loading-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #FFFFFF;
      z-index: 99999;
      transition: opacity 0.3s ease-out;
    }
    .loading-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 28px 32px;
      border-radius: 4px;
      background: #FFFFFF;
      border: 1px solid #DADCE0;
      max-width: 340px;
      width: 85%;
      text-align: center;
    }
    .loading-logo-box {
      width: 48px;
      height: 48px;
      border-radius: 4px;
      background: rgba(36, 87, 197, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
    }
    .loading-title {
      font-size: 16px;
      font-weight: 700;
      color: #202124;
      margin-bottom: 4px;
      letter-spacing: -0.2px;
    }
    .loading-subtitle {
      font-size: 12.5px;
      color: #5F6368;
      margin-bottom: 20px;
    }
    .loading-spinner {
      width: 32px;
      height: 32px;
      border: 2.5px solid #E8F0FE;
      border-top-color: #2457C5;
      border-radius: 50%;
      animation: spin 0.8s cubic-bezier(0.55, 0.15, 0.45, 0.85) infinite;
      margin-bottom: 14px;
    }
    .loading-status {
      font-size: 12px;
      color: #2457C5;
      font-weight: 600;
      letter-spacing: 0.2px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @media (prefers-color-scheme: dark) {
      body, #loading-screen {
        background: #202124;
      }
      .loading-card {
        background: #202124;
        border-color: #3C4043;
      }
      .loading-logo-box {
        background: rgba(138, 180, 248, 0.12);
      }
      .loading-logo-box svg {
        fill: #8AB4F8;
      }
      .loading-title {
        color: #F1F3F4;
      }
      .loading-subtitle {
        color: #9AA0A6;
      }
      .loading-spinner {
        border-color: #3C4043;
        border-top-color: #8AB4F8;
      }
      .loading-status {
        color: #8AB4F8;
      }
    }
  </style>
</head>
<body>
  <div id="loading-screen">
    <div class="loading-card">
      <div class="loading-logo-box">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="#2457C5">
          <path d="M5 13.18v4L12 21l7-3.82v-4L12 17l-7-3.82zM12 3L1 9l11 6 9-4.91V17h2V9L12 3z"/>
        </svg>
      </div>
      <div class="loading-title">Cổng Thông Tin Giáo Dục Đại Việt</div>
      <div class="loading-subtitle">Hệ thống quản lý học tập & học liệu số</div>
      <div class="loading-spinner"></div>
      <div class="loading-status">Đang nạp ứng dụng...</div>
    </div>
  </div>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      var loader = document.getElementById('loading-screen');
      if (loader) {
        loader.style.opacity = '0';
        setTimeout(function() {
          loader.remove();
        }, 400);
      }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
