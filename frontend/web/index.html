<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Cổng Thông Tin Giáo Dục Đại Việt - Hệ thống quản lý trường học và học liệu số thông minh.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Giáo Dục Đại Việt">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Cổng Thông Tin Giáo Dục Đại Việt</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #F8F9FA;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    #loading-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #F8F9FA;
      z-index: 99999;
      transition: opacity 0.4s ease-out;
    }
    .loading-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 32px;
      border-radius: 16px;
      background: #FFFFFF;
      box-shadow: 0 4px 24px rgba(36, 87, 197, 0.08);
      max-width: 360px;
      width: 85%;
      text-align: center;
    }
    .loading-logo-box {
      width: 64px;
      height: 64px;
      border-radius: 16px;
      background: linear-gradient(135deg, #2457C5 0%, #1A3E8F 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      box-shadow: 0 6px 16px rgba(36, 87, 197, 0.25);
    }
    .loading-title {
      font-size: 17px;
      font-weight: 700;
      color: #202124;
      margin-bottom: 6px;
      letter-spacing: -0.2px;
    }
    .loading-subtitle {
      font-size: 13px;
      color: #5F6368;
      margin-bottom: 24px;
    }
    .loading-spinner {
      width: 36px;
      height: 36px;
      border: 3px solid #E8F0FE;
      border-top-color: #2457C5;
      border-radius: 50%;
      animation: spin 0.9s cubic-bezier(0.55, 0.15, 0.45, 0.85) infinite;
      margin-bottom: 16px;
    }
    .loading-status {
      font-size: 13px;
      color: #2457C5;
      font-weight: 500;
      letter-spacing: 0.1px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="loading-screen">
    <div class="loading-card">
      <div class="loading-logo-box">
        <!-- SVG Education Graduation Cap & Book Icon -->
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 10v6M2 10l10-5 10 5-10 5z"></path>
          <path d="M6 12v5c3 3 9 3 12 0v-5"></path>
        </svg>
      </div>
      <div class="loading-title">Cổng Thông Tin Giáo Dục Đại Việt</div>
      <div class="loading-subtitle">Hệ thống quản lý học tập & học liệu số</div>
      <div class="loading-spinner"></div>
      <div class="loading-status">Đang tải ứng dụng...</div>
    </div>
  </div>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      var loader = document.getElementById('loading-screen');
      if (loader) {
        loader.style.opacity = '0';
        setTimeout(function() {
          loader.remove();
        }, 400);
      }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
