<!DOCTYPE html>
<html>

<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description"
    content="Cổng Thông Tin Giáo Dục Đại Việt - Hệ thống quản lý trường học và học liệu số thông minh.">

  <!-- Viewport: Khóa cứng tỷ lệ hiển thị di động, chống zoom, chống pan/kéo màn hình -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Giáo Dục Đại Việt">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png" />

  <title>Cổng Thông Tin Giáo Dục Đại Việt</title>
  <!-- Google Fonts Preconnect & Optimized Fallback -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <style>
    :root {
      --bg-color: #FFFFFF;
      --primary-color: #2457C5;
      --primary-dark: #1D479F;
      --limb-color: #202124;
      --pupil-color: #202124;
      --paper-color: #F5F6F7;
      --line-color: #DADCE0;
      --text-main: #202124;
      --text-muted: #5F6368;
      --slogan-color: #4A5568;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-color: #202124;
        --primary-color: #8AB4F8;
        --primary-dark: #669DF6;
        --limb-color: #E8EAED;
        --pupil-color: #202124;
        --paper-color: #303134;
        --line-color: #3C4043;
        --text-main: #F1F3F4;
        --text-muted: #9AA0A6;
        --slogan-color: #BDC1C6;
      }
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      background: var(--bg-color);
      font-family: "Plus Jakarta Sans", "Be Vietnam Pro", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      overflow: hidden;
      position: fixed;
      inset: 0;
      touch-action: none;
      overscroll-behavior: none;
      -webkit-overflow-scrolling: auto;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }

    #loading-screen {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--bg-color);
      z-index: 99999;
      touch-action: none;
      overscroll-behavior: none;
      overflow: hidden;
      transition: opacity 0.35s ease-out;
    }

    #loading-screen.fade-out {
      opacity: 0;
      pointer-events: none;
    }

    .loader-stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      user-select: none;
      -webkit-user-select: none;
      width: 100%;
      max-width: 480px;
      height: 100%;
      max-height: 900px;
      position: relative;
      overflow: hidden;
      margin: 0 auto;
    }

    /* Sân khấu đường chạy ngang: Cố định gọn gàng trong khung điện thoại */
    .mascot-track {
      width: 100%;
      max-width: 480px;
      height: 175px;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Đường mặt đất phẳng kéo dài theo bề ngang khung điện thoại */
    .track-ground-line {
      position: absolute;
      left: 0;
      right: 0;
      width: 100%;
      height: 2px;
      background: var(--line-color);
      opacity: 0.55;
      bottom: 27px;
    }

    /* Vạch gạch nền thị sai ngắt quãng dưới mặt đất (đồng bộ Flutter Pha 2) */
    .track-ground-bricks {
      position: absolute;
      left: 0;
      right: 0;
      width: 100%;
      height: 2px;
      bottom: 20px;
      opacity: 0.35;
      background: repeating-linear-gradient(90deg,
          var(--line-color) 0px,
          var(--line-color) 35px,
          transparent 35px,
          transparent 70px);
    }

    /* Nhân vật Mascot di chuyển ngang (Tỷ lệ 1.25 khớp 100% Pha 2 Flutter: 138px x 163px) */
    .mascot-runner {
      width: 138px;
      height: 163px;
      position: relative;
      animation: runnerTrackMotion 4.5s infinite ease-in-out;
      will-change: transform, opacity;
    }

    .mascot-svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    /* Mascot Animations Đồng Bộ Theo Timeline 4.5s */
    .mascot-body-group {
      animation: bodyBounceMotion 4.5s infinite ease-in-out;
      transform-origin: 55px 84px;
    }

    .shadow-shape {
      animation: shadowMotion 4.5s infinite ease-in-out;
      transform-origin: 55px 115px;
    }

    .leg-l {
      animation: legLeftMotion 4.5s infinite ease-in-out;
      transform-origin: 33px 84px;
    }

    .leg-r {
      animation: legRightMotion 4.5s infinite ease-in-out;
      transform-origin: 61px 84px;
    }

    .arm-l {
      animation: armLeftMotion 4.5s infinite ease-in-out;
      transform-origin: 8px 34px;
    }

    .arm-r {
      animation: armRightMotion 4.5s infinite ease-in-out;
      transform-origin: 84px 34px;
    }

    .ribbon-shape {
      animation: ribbonMotion 4.5s infinite ease-in-out;
      transform-origin: 49px 84px;
    }

    .wave-lines {
      animation: waveLinesMotion 4.5s infinite ease-in-out;
      transform-origin: 84px 34px;
    }

    /* 1. Di chuyển cả nhân vật: Đồng bộ 100% công thức biên độ thoát half và gia tốc Cubic của Pha 2 */
    @keyframes runnerTrackMotion {

      /* 0% - 24%: Đứng chính giữa sân khấu vẫy tay chào */
      0%,
      24% {
        transform: translateX(0);
        opacity: 1;
        animation-timing-function: cubic-bezier(0.32, 0, 0.67, 0); /* Curves.easeInCubic chuẩn Pha 2 */
      }

      /* 24% - 49.5%: Sải bước tăng tốc và THOÁT HOÀN TOÀN 100% RA KHỎI MÉP PHẢI (nửa màn hình + nửa thân chú sách) */
      49.5% {
        transform: translateX(calc(min(50vw, 240px) + 90px));
        opacity: 1;
      }

      /* 49.6% - 53.5%: Đã khuất hoàn toàn 100% sau mép phải, ẩn ngầm và đổi vị trí sang ngoài mép trái */
      49.6%,
      53.5% {
        transform: translateX(calc(-1 * min(50vw, 240px) - 90px));
        opacity: 0;
        animation-timing-function: cubic-bezier(0.33, 1, 0.68, 1); /* Curves.easeOutCubic chuẩn Pha 2 */
      }

      /* 54%: Xuất hiện sẵn sàng ở vị trí ngoài mép trái màn hình */
      54% {
        transform: translateX(calc(-1 * min(50vw, 240px) - 90px));
        opacity: 1;
      }

      /* 54% - 85%: Bước đều từ ngoài mép trái vào giữa với gia tốc giảm tốc êm ái Curves.easeOutCubic */
      85%,
      100% {
        transform: translateX(0);
        opacity: 1;
      }
    }

    /* 2. Tay phải: Vẫy chào ở giữa (0-24%), đung đưa khi chạy (24-50% & 54-85%) */
    @keyframes armRightMotion {

      /* 0% - 24%: Từ thế nghỉ nâng tay vẫy chào 3 nhịp vui vẻ */
      0% {
        transform: rotate(0deg);
      }

      4% {
        transform: rotate(-38deg);
      }

      9% {
        transform: rotate(-10deg);
      }

      14% {
        transform: rotate(-42deg);
      }

      19% {
        transform: rotate(-10deg);
      }

      24% {
        transform: rotate(10deg);
      }

      /* 24% - 50%: Chạy sang phải (vung tay đi bộ) */
      28% {
        transform: rotate(-16deg);
      }

      34% {
        transform: rotate(18deg);
      }

      40% {
        transform: rotate(-16deg);
      }

      46% {
        transform: rotate(18deg);
      }

      50% {
        transform: rotate(0deg);
      }

      /* 50.1% - 54%: Ẩn ngầm */
      50.1%,
      54% {
        transform: rotate(0deg);
      }

      /* 54.1% - 85%: Chạy từ trái vào giữa (vung tay đi bộ) */
      58% {
        transform: rotate(-16deg);
      }

      64% {
        transform: rotate(18deg);
      }

      70% {
        transform: rotate(-16deg);
      }

      76% {
        transform: rotate(18deg);
      }

      82% {
        transform: rotate(-10deg);
      }

      85%,
      100% {
        transform: rotate(0deg);
      }
    }

    /* 3. Tay trái: Buông nhẹ ở giữa (0-24%), vung ngược pha khi chạy */
    @keyframes armLeftMotion {

      0%,
      24% {
        transform: rotate(0deg);
      }

      /* 24% - 50%: Vung tay đi bộ */
      28% {
        transform: rotate(18deg);
      }

      34% {
        transform: rotate(-16deg);
      }

      40% {
        transform: rotate(18deg);
      }

      46% {
        transform: rotate(-16deg);
      }

      50% {
        transform: rotate(0deg);
      }

      50.1%,
      54% {
        transform: rotate(0deg);
      }

      /* 54.1% - 85%: Vung tay vào giữa */
      58% {
        transform: rotate(18deg);
      }

      64% {
        transform: rotate(-16deg);
      }

      70% {
        transform: rotate(18deg);
      }

      76% {
        transform: rotate(-16deg);
      }

      82% {
        transform: rotate(10deg);
      }

      85%,
      100% {
        transform: rotate(0deg);
      }
    }

    /* 4. Chân trái: Đứng vững ở giữa, bước so le khi chạy */
    @keyframes legLeftMotion {

      0%,
      24% {
        transform: translateY(0);
      }

      /* 24% - 50%: Bước chân */
      28% {
        transform: translateY(-7px) rotate(-3deg);
      }

      34% {
        transform: translateY(0);
      }

      40% {
        transform: translateY(-7px) rotate(-3deg);
      }

      46% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(0);
      }

      50.1%,
      54% {
        transform: translateY(0);
      }

      /* 54.1% - 85%: Bước chân vào giữa */
      58% {
        transform: translateY(-7px) rotate(-3deg);
      }

      64% {
        transform: translateY(0);
      }

      70% {
        transform: translateY(-7px) rotate(-3deg);
      }

      76% {
        transform: translateY(0);
      }

      82% {
        transform: translateY(-3px);
      }

      85%,
      100% {
        transform: translateY(0);
      }
    }

    /* 5. Chân phải: Đứng vững ở giữa, bước so le đối xứng */
    @keyframes legRightMotion {

      0%,
      24% {
        transform: translateY(0);
      }

      /* 24% - 50%: Bước chân so le */
      28% {
        transform: translateY(0);
      }

      34% {
        transform: translateY(-7px) rotate(3deg);
      }

      40% {
        transform: translateY(0);
      }

      46% {
        transform: translateY(-7px) rotate(3deg);
      }

      50% {
        transform: translateY(0);
      }

      50.1%,
      54% {
        transform: translateY(0);
      }

      /* 54.1% - 85%: Bước chân vào giữa */
      58% {
        transform: translateY(0);
      }

      64% {
        transform: translateY(-7px) rotate(3deg);
      }

      70% {
        transform: translateY(0);
      }

      76% {
        transform: translateY(-7px) rotate(3deg);
      }

      82% {
        transform: translateY(0);
      }

      85%,
      100% {
        transform: translateY(0);
      }
    }

    /* 6. Thân sách: Thở nhẹ ở giữa, nghiêng nhẹ & nhấp nhô khi chạy */
    @keyframes bodyBounceMotion {

      /* 0% - 24%: Thở nhẹ */
      0% {
        transform: translateY(0) rotate(0deg);
      }

      12% {
        transform: translateY(-3px) rotate(-0.5deg);
      }

      24% {
        transform: translateY(0) rotate(0deg);
      }

      /* 24% - 50%: Nghiêng người hướng chạy và nhún nhảy */
      28% {
        transform: translateY(-6px) rotate(2.5deg);
      }

      34% {
        transform: translateY(0) rotate(1deg);
      }

      40% {
        transform: translateY(-6px) rotate(2.5deg);
      }

      46% {
        transform: translateY(0) rotate(1deg);
      }

      50% {
        transform: translateY(0) rotate(0deg);
      }

      50.1%,
      54% {
        transform: translateY(0) rotate(0deg);
      }

      /* 54.1% - 85%: Nghiêng người hướng chạy vào giữa */
      58% {
        transform: translateY(-6px) rotate(2.5deg);
      }

      64% {
        transform: translateY(0) rotate(1deg);
      }

      70% {
        transform: translateY(-6px) rotate(2.5deg);
      }

      76% {
        transform: translateY(0) rotate(1deg);
      }

      82% {
        transform: translateY(-2px) rotate(0.5deg);
      }

      85%,
      100% {
        transform: translateY(0) rotate(0deg);
      }
    }

    /* 7. Bóng đổ: Co giãn theo nhịp nhún nhảy và biến mất khi ra ngoài */
    @keyframes shadowMotion {

      0%,
      24% {
        transform: scaleX(1);
        opacity: 0.75;
      }

      12% {
        transform: scaleX(0.9);
        opacity: 0.6;
      }

      28%,
      40% {
        transform: scaleX(0.82);
        opacity: 0.5;
      }

      34%,
      46% {
        transform: scaleX(1);
        opacity: 0.75;
      }

      50% {
        transform: scaleX(1);
        opacity: 0;
      }

      50.1%,
      54% {
        opacity: 0;
      }

      58%,
      70% {
        transform: scaleX(0.82);
        opacity: 0.5;
      }

      64%,
      76% {
        transform: scaleX(1);
        opacity: 0.75;
      }

      82% {
        transform: scaleX(0.9);
        opacity: 0.65;
      }

      85%,
      100% {
        transform: scaleX(1);
        opacity: 0.75;
      }
    }

    /* 8. Dây bookmark đung đưa khi chạy */
    @keyframes ribbonMotion {

      0%,
      24% {
        transform: rotate(0deg);
      }

      28%,
      40%,
      58%,
      70% {
        transform: rotate(-7deg);
      }

      34%,
      46%,
      64%,
      76% {
        transform: rotate(7deg);
      }

      85%,
      100% {
        transform: rotate(0deg);
      }
    }

    /* 9. Vạch sóng vẫy tay khi chào ở giữa (0% - 24%) */
    @keyframes waveLinesMotion {

      0%,
      3% {
        opacity: 0;
      }

      4%,
      22% {
        opacity: 1;
      }

      6%,
      12%,
      18% {
        opacity: 0.25;
      }

      9%,
      15%,
      21% {
        opacity: 1;
      }

      24%,
      100% {
        opacity: 0;
      }
    }

    /* ==========================================================
       10. CUỐN SÁCH NHỎ (MINI-BOOK) — XOAY RA SAU, MỞ BÌA, VẪY, ĐÓNG LẠI
       Khi mở, ruột sách (trang giấy) hướng VÀO mặt nhân vật; người xem
       chỉ thấy 2 mặt BÌA NGOÀI: bìa sau ở bên trái, bìa trước ở bên phải,
       gáy sách ở giữa, mép trên của xấp giấy thò lên phía trên.

       Timeline 4.5s đồng bộ với tay cầm sách:
       -  0% -  3% : Tay giơ lên, sách đóng (thấy bìa trước)
       -  3% -  5.5%: Cả cuốn sách xoay ngang một vòng -> thấy bìa sau
       -  5.5% -  9% : Bìa trước (đang nằm sau bìa sau) lật vòng quanh gáy sang phải,
                      sách mở thành chữ V nhìn từ phía sau; ánh sáng ấm tỏa ra
       -  9% - 19.5%: Sách mở, vẫy vẫy; mép giấy rung, lấp lánh
       - 19.5% - 22% : Bìa trước lật về, sách khép lại
       - 22% - 24.8%: Xoay ngược lại -> thấy bìa trước
       - 24.8% - 85%: Sách đóng, lắc nhẹ khi chạy, vệt sáng lướt qua bìa

       Toạ độ cục bộ của sách: gốc (0,0) = góc trên trái bìa trước đóng,
       sách rộng 18, cao 25; tâm sách ở x = 9.
       Khi mở: tâm gáy ở x = 9; bìa sau chiếm x ∈ [-5.8, 9];
       bìa trước chiếm x ∈ [9, 23.8] (đã thu hẹp 0.82 để có chiều sâu).
       ========================================================== */

    /* Sách đung đưa theo cổ tay: gốc xoay ở chỗ bàn tay nắm (góc dưới trái) */
    .book-sway {
      animation: bookSwayMotion 4.5s infinite ease-in-out;
      transform-origin: 4px 22px;
    }

    @keyframes bookSwayMotion {
      0% {
        transform: rotate(0deg);
      }

      4% {
        transform: rotate(-4deg);
      }

      9% {
        transform: rotate(6deg);
      }

      14% {
        transform: rotate(-8deg);
      }

      19% {
        transform: rotate(6deg);
      }

      24% {
        transform: rotate(0deg);
      }

      28% {
        transform: rotate(4deg);
      }

      34% {
        transform: rotate(-3deg);
      }

      40% {
        transform: rotate(4deg);
      }

      46% {
        transform: rotate(-3deg);
      }

      50%,
      50.1%,
      54% {
        transform: rotate(0deg);
      }

      58% {
        transform: rotate(4deg);
      }

      64% {
        transform: rotate(-3deg);
      }

      70% {
        transform: rotate(4deg);
      }

      76% {
        transform: rotate(-3deg);
      }

      82% {
        transform: rotate(2deg);
      }

      85%,
      100% {
        transform: rotate(0deg);
      }
    }

    /* --- Bìa trước đóng (thấy khi chưa mở / đã đóng) --- */
    .book-closed-front {
      transform-origin: 0 0;
      animation: bookClosedFrontMotion 4.5s infinite ease-in-out,
        bookClosedFrontFade 4.5s infinite linear;
    }

    @keyframes bookClosedFrontMotion {

      0%,
      3% {
        transform: translateX(0) scaleX(1);
      }

      4.2% {
        transform: translateX(9px) scaleX(0);
      }

      23% {
        transform: translateX(9px) scaleX(0);
      }

      24% {
        transform: translateX(-0.45px) scaleX(1.05);
      }

      24.8%,
      100% {
        transform: translateX(0) scaleX(1);
      }
    }

    @keyframes bookClosedFrontFade {

      0%,
      4.2% {
        opacity: 1;
      }

      4.3%,
      22.9% {
        opacity: 0;
      }

      23%,
      100% {
        opacity: 1;
      }
    }

    /* --- Bìa sau: lộ ra khi sách xoay, trở thành nửa TRÁI của sách mở --- */
    .book-panel-back {
      opacity: 0;
      transform-origin: 0 0;
      animation: bookPanelBackMotion 4.5s infinite ease-in-out,
        bookPanelBackFade 4.5s infinite linear;
    }

    @keyframes bookPanelBackMotion {

      0%,
      4.2% {
        transform: translateX(9px) scaleX(0);
      }

      5.5% {
        transform: translateX(0) scaleX(1);
      }

      8.3% {
        transform: translateX(-6.1px) scaleX(0.79);
      }

      9%,
      19.5% {
        transform: translateX(-5.76px) scaleX(0.82);
      }

      22% {
        transform: translateX(0) scaleX(1);
      }

      23%,
      100% {
        transform: translateX(9px) scaleX(0);
      }
    }

    @keyframes bookPanelBackFade {

      0%,
      4.1% {
        opacity: 0;
      }

      4.2%,
      23% {
        opacity: 1;
      }

      23.1%,
      100% {
        opacity: 0;
      }
    }

    /* --- Bìa trước lật vòng quanh gáy sang phải: nửa PHẢI của sách mở ---
       Ban đầu nằm khuất sau bìa sau (đối xứng gương), rồi quay 180° quanh gáy. */
    .book-panel-front {
      opacity: 0;
      transform-origin: 0 0;
      animation: bookPanelFrontMotion 4.5s infinite ease-in-out,
        bookPanelFrontFade 4.5s infinite linear;
    }

    @keyframes bookPanelFrontMotion {

      0%,
      5.5% {
        transform: translateX(18px) scaleX(-1);
      }

      7% {
        transform: translateX(13px) scaleX(0);
      }

      8.3% {
        transform: translateX(9.5px) scaleX(0.9);
      }

      9%,
      19.5% {
        transform: translateX(9px) scaleX(0.82);
      }

      20.8% {
        transform: translateX(13px) scaleX(0);
      }

      22%,
      100% {
        transform: translateX(18px) scaleX(-1);
      }
    }

    @keyframes bookPanelFrontFade {

      0%,
      5.4% {
        opacity: 0;
      }

      5.5%,
      22% {
        opacity: 1;
      }

      22.1%,
      100% {
        opacity: 0;
      }
    }

    /* --- Mép trên xấp giấy thò lên sau 2 bìa + bóng đổ rộng khi mở --- */
    .book-pagetop,
    .book-open-shadow {
      opacity: 0;
      animation: bookOpenFade 4.5s infinite ease-in-out;
    }

    @keyframes bookOpenFade {

      0%,
      6% {
        opacity: 0;
      }

      9%,
      19.5% {
        opacity: 1;
      }

      22%,
      100% {
        opacity: 0;
      }
    }

    /* Các lớp giấy phía trên rung nhẹ khi vẫy */
    .book-pagetop-a {
      animation: bookPageTopA 4.5s infinite ease-in-out;
    }

    .book-pagetop-b {
      animation: bookPageTopB 4.5s infinite ease-in-out;
    }

    .book-pagetop-c {
      animation: bookPageTopC 4.5s infinite ease-in-out;
    }

    @keyframes bookPageTopA {

      0%,
      9% {
        transform: translateY(0);
      }

      11% {
        transform: translateY(-1.1px);
      }

      13% {
        transform: translateY(0);
      }

      15% {
        transform: translateY(-1.1px);
      }

      17% {
        transform: translateY(0);
      }

      19% {
        transform: translateY(-1.1px);
      }

      20.5%,
      100% {
        transform: translateY(0);
      }
    }

    @keyframes bookPageTopB {

      0%,
      10% {
        transform: translateY(0);
      }

      12% {
        transform: translateY(-1.1px);
      }

      14% {
        transform: translateY(0);
      }

      16% {
        transform: translateY(-1.1px);
      }

      18% {
        transform: translateY(0);
      }

      20% {
        transform: translateY(-1.1px);
      }

      21.5%,
      100% {
        transform: translateY(0);
      }
    }

    @keyframes bookPageTopC {

      0%,
      11% {
        transform: translateY(0);
      }

      13% {
        transform: translateY(-1.1px);
      }

      15% {
        transform: translateY(0);
      }

      17% {
        transform: translateY(-1.1px);
      }

      19% {
        transform: translateY(0);
      }

      20.5%,
      100% {
        transform: translateY(0);
      }
    }

    /* Dây đánh dấu trang đung đưa như con lắc ngay dưới gáy sách */
    .book-bookmark {
      animation: bookBookmarkMotion 4.5s infinite ease-in-out;
      transform-origin: 9.6px 22px;
    }

    @keyframes bookBookmarkMotion {
      0% {
        transform: rotate(0deg);
      }

      4% {
        transform: rotate(-12deg);
      }

      9% {
        transform: rotate(14deg);
      }

      14% {
        transform: rotate(-12deg);
      }

      19% {
        transform: rotate(14deg);
      }

      24% {
        transform: rotate(0deg);
      }

      28% {
        transform: rotate(9deg);
      }

      34% {
        transform: rotate(-9deg);
      }

      40% {
        transform: rotate(9deg);
      }

      46% {
        transform: rotate(-9deg);
      }

      50%,
      50.1%,
      54% {
        transform: rotate(0deg);
      }

      58% {
        transform: rotate(9deg);
      }

      64% {
        transform: rotate(-9deg);
      }

      70% {
        transform: rotate(9deg);
      }

      76% {
        transform: rotate(-9deg);
      }

      82% {
        transform: rotate(4deg);
      }

      85%,
      100% {
        transform: rotate(0deg);
      }
    }

    /* Ánh sáng ấm tỏa ra phía sau sách khi mở */
    .book-glow {
      opacity: 0;
      animation: bookGlowPulse 4.5s infinite ease-in-out;
    }

    @keyframes bookGlowPulse {

      0%,
      6% {
        opacity: 0;
      }

      9% {
        opacity: 0.5;
      }

      14% {
        opacity: 0.3;
      }

      19% {
        opacity: 0.5;
      }

      22%,
      100% {
        opacity: 0;
      }
    }

    /* Vệt sáng quét chéo qua bìa sách đóng (lúc chạy và lúc vừa chạy tới nơi) */
    .book-shine {
      animation: bookShineSweep 4.5s infinite ease-in-out;
      opacity: 0;
    }

    @keyframes bookShineSweep {

      0%,
      25% {
        transform: translateX(-10px);
        opacity: 0;
      }

      27% {
        opacity: 0.85;
      }

      34% {
        transform: translateX(32px);
        opacity: 0.85;
      }

      36%,
      86% {
        transform: translateX(32px);
        opacity: 0;
      }

      87% {
        transform: translateX(-10px);
        opacity: 0;
      }

      89% {
        opacity: 0.85;
      }

      95% {
        transform: translateX(32px);
        opacity: 0.85;
      }

      97%,
      100% {
        transform: translateX(32px);
        opacity: 0;
      }
    }

    /* Các tia lấp lánh bay quanh cuốn sách khi mở và vẫy */
    .book-spark-a,
    .book-spark-b,
    .book-spark-c {
      opacity: 0;
      transform-box: fill-box;
      transform-origin: center;
    }

    .book-spark-a {
      animation: bookSparkA 4.5s infinite ease-in-out;
    }

    .book-spark-b {
      animation: bookSparkB 4.5s infinite ease-in-out;
    }

    .book-spark-c {
      animation: bookSparkC 4.5s infinite ease-in-out;
    }

    @keyframes bookSparkA {

      0%,
      6% {
        opacity: 0;
        transform: scale(0) rotate(0deg);
      }

      9% {
        opacity: 1;
        transform: scale(1.2) rotate(45deg);
      }

      12% {
        opacity: 0.2;
        transform: scale(0.5) rotate(90deg);
      }

      15% {
        opacity: 1;
        transform: scale(1.1) rotate(135deg);
      }

      18% {
        opacity: 0.2;
        transform: scale(0.5) rotate(180deg);
      }

      21%,
      100% {
        opacity: 0;
        transform: scale(0) rotate(225deg);
      }
    }

    @keyframes bookSparkB {

      0%,
      8% {
        opacity: 0;
        transform: scale(0) rotate(0deg);
      }

      11% {
        opacity: 1;
        transform: scale(1) rotate(-45deg);
      }

      14% {
        opacity: 0.2;
        transform: scale(0.4) rotate(-90deg);
      }

      17% {
        opacity: 1;
        transform: scale(1.2) rotate(-135deg);
      }

      20% {
        opacity: 0.2;
        transform: scale(0.4) rotate(-180deg);
      }

      22%,
      100% {
        opacity: 0;
        transform: scale(0) rotate(-225deg);
      }
    }

    @keyframes bookSparkC {

      0%,
      9% {
        opacity: 0;
        transform: scale(0);
      }

      12% {
        opacity: 1;
        transform: scale(1);
      }

      15% {
        opacity: 0.2;
        transform: scale(0.4);
      }

      18% {
        opacity: 1;
        transform: scale(0.9);
      }

      21%,
      100% {
        opacity: 0;
        transform: scale(0);
      }
    }

    /* Text & Transition Layout */
    .text-stage-wrap {
      margin-top: 14px;
      height: 54px;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-width: 280px;
    }

    /* Phase 1: Loading Info */
    .loading-status-wrap {
      display: flex;
      align-items: baseline;
      justify-content: center;
      font-size: 15px;
      font-weight: 500;
      color: var(--text-muted);
      letter-spacing: -0.1px;
      transition: opacity 0.25s ease-out, transform 0.25s ease-out;
      position: absolute;
    }

    .dot {
      display: inline-block;
      animation: dotPulse 1.2s infinite ease-in-out;
      font-weight: 700;
    }

    .dot-1 {
      animation-delay: 0s;
    }

    .dot-2 {
      animation-delay: 0.22s;
    }

    .dot-3 {
      animation-delay: 0.44s;
    }

    @keyframes dotPulse {

      0%,
      80%,
      100% {
        opacity: 0.2;
        transform: translateY(0px);
      }

      40% {
        opacity: 1;
        transform: translateY(-2px);
      }
    }

    /* Phase 2: Brand Reveal */
    .brand-reveal-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 0.35s cubic-bezier(0.16, 1, 0.3, 1), transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      position: absolute;
      pointer-events: none;
    }

    .brand-title {
      font-size: 18px;
      font-weight: 800;
      color: var(--text-main);
      letter-spacing: 0.6px;
      line-height: 1.25;
      text-transform: uppercase;
    }

    .brand-slogan {
      font-size: 13.5px;
      font-style: italic;
      font-weight: 400;
      color: var(--slogan-color);
      letter-spacing: -0.1px;
      margin-top: 5px;
    }

    /* State Switch khi Flutter đã sẵn sàng */
    #loading-screen.ready .loading-status-wrap {
      opacity: 0;
      transform: translateY(-8px);
      pointer-events: none;
    }

    #loading-screen.ready .brand-reveal-wrap {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    /* Tôn trọng cài đặt giảm chuyển động của hệ điều hành */
    @media (prefers-reduced-motion: reduce) {

      .mascot-runner,
      .mascot-body-group,
      .shadow-shape,
      .leg-l,
      .leg-r,
      .arm-l,
      .arm-r,
      .ribbon-shape,
      .wave-lines,
      .book-sway,
      .book-closed-front,
      .book-panel-back,
      .book-panel-front,
      .book-pagetop,
      .book-open-shadow,
      .book-pagetop-a,
      .book-pagetop-b,
      .book-pagetop-c,
      .book-bookmark,
      .book-glow,
      .book-shine,
      .book-spark-a,
      .book-spark-b,
      .book-spark-c,
      .dot {
        animation: none !important;
      }

      .mascot-runner {
        transform: translateX(0) !important;
        opacity: 1 !important;
      }

      .wave-lines {
        opacity: 0 !important;
      }
    }
  </style>
</head>

<body>
  <div id="loading-screen">
    <div class="loader-stage">
      <!-- Sân khấu đường chạy ngang: Chú sách chạy Loop tuần hoàn -->
      <div class="mascot-track">
        <div class="track-ground-line"></div>
        <div class="track-ground-bricks"></div>
        <div class="mascot-runner">
          <svg class="mascot-svg" viewBox="0 0 110 130" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <!-- Bìa cuốn sách nhỏ: chuyển màu hổ phách 3 tầng tạo khối -->
              <linearGradient id="miniBookCoverGrad" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#FBBF24" />
                <stop offset="45%" stop-color="#E88A0C" />
                <stop offset="100%" stop-color="#B45309" />
              </linearGradient>
              <!-- Gáy sách (gáy nằm bên trái): tối ở mép ngoài -> sáng dần vào trong -->

                <stop offset="0%" stop-color="#92400E" />
                <stop offset="100%" stop-color="#B45309" />
              </linearGradient>
              <!-- Gáy sách của bìa sau (gáy nằm bên phải): ngược chiều -->
              <linearGradient id="miniBookSpineGradR" x1="0" y1="0" x2="1" y2="0">
                <stop offset="0%" stop-color="#B45309" />
                <stop offset="100%" stop-color="#92400E" />
              </linearGradient>
              <!-- Khung cắt để vệt sáng chỉ chạy trong phạm vi bìa -->
              <clipPath id="miniBookCoverClip">
                <rect x="0" y="0" width="18" height="25" rx="2" />
              </clipPath>
              <!-- Ánh sáng ấm tỏa ra khi sách mở -->
              <radialGradient id="miniBookGlow" cx="0.5" cy="0.5" r="0.5">

                <stop offset="100%" stop-color="#FDE68A" stop-opacity="0" />
              </radialGradient>

              <!-- Hình vẽ MẶT NGOÀI BÌA TRƯỚC (dùng cho cả sách đóng lẫn nửa phải của sách mở) -->
              <g id="miniFrontCoverArt">
                <!-- Bìa trước -->
                <rect x="0" y="0" width="18" height="25" rx="2" fill="url(#miniBookCoverGrad)" />

                <!-- Gáy sách có đường chỉ khâu -->
                <rect x="0" y="0" width="4.2" height="25" rx="2" fill="url(#miniBookSpineGrad)" />

                  opacity="0.7" />

                <!-- Huy hiệu ngôi sao 4 cánh trên bìa -->
                <circle cx="11.4" cy="9.4" r="3.6" fill="#FEF3C7" opacity="0.95" />
                <path d="M11.4 6.2 L12.3 8.5 L14.6 9.4 L12.3 10.3 L11.4 12.6 L10.5 10.3 L8.2 9.4 L10.5 8.5 Z"
                  fill="#D97706" />

                <!-- Dòng chữ tiêu đề giả lập trên bìa -->
                <rect x="7.8" y="15" width="7.2" height="1.4" rx="0.7" fill="#FFFBEB" />

                <!-- Bọc góc sách bằng kim loại vàng -->

                <path d="M18 25 L18 21.4 L14.4 25 Z" fill="#FDE68A" opacity="0.9" />
              </g>
            </defs>

            <!-- 1. Bóng đổ phẳng di chuyển đồng bộ dưới chân chú sách -->
            <rect class="shadow-shape" x="24" y="115" width="62" height="4" rx="2" fill="var(--line-color)" />

  <script>
    // Khóa cứng ngăn chặn mọi hành vi kéo vuốt làm trôi màn hình lúc loading
    window.addEventListener('touchmove', function (e) {
      var screen = document.getElementById('loading-screen');
      if (screen && !screen.classList.contains('fade-out')) {
        e.preventDefault();
      }
    }, { passive: false });

    window.addEventListener('gesturestart', function (e) {
      e.preventDefault();
    }, { passive: false });

    window.addEventListener('flutter-first-frame', function () {
      var screen = document.getElementById('loading-screen');
      if (screen) {
        // Khi Flutter nạp xong khung hình đầu tiên, Web loader mờ dần ngay
        // để chuyển giao trọn vẹn màn hình cho chú sách vẫy tay chào của Flutter
        screen.classList.add('fade-out');
        setTimeout(function () {
          if (screen.parentNode) {
            screen.parentNode.removeChild(screen);
          }
        }, 350);
      }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
